# Dependabot — aggiornamenti automatici settimanali (lunedì, ora di Roma).
# Minor/patch raggruppati in un'unica PR per ecosistema; le major arrivano una per PR.
# Tracciato su Jira: SVIL-56.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    groups:
      npm_minor_patch:
        patterns: ["*"]
        update-types: [minor, patch]
